<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeScript Array of Object UI</title>
    <script src="script.js"></script>
    <style>
      body {
        font-family: Arial;
        background: #f4f4f4;
        text-align: center;
      }

      .container {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .card {
        background: white;
        width: 200px;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
      }

      .card img {
        width: 100%;
        border-radius: 10px;
      }

      button {
        padding: 8px 12px;
        background: black;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Our Products</h1>
    <div class="productContainer" id="productContainer"></div>
  </body>
</html>
