<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="optional_chaining.js" async></script>
    <style>
     .container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 12px;
}

.card h2 {
  font-size: 18px;
  margin: 10px 0;
}

.card p {
  font-size: 14px;
  margin: 5px 0;
}

.price {
  font-weight: bold;
  color: green;
}

.rating {
  color: orange;
}
.card button {
    padding: 10px 20px;
    background-color: pink;
    color: white;
    border: none;
    border-radius: 7px;
} 


    </style>
</head>
<body>
        <div id="product-container" class="container"></div>
</body>
</html>
